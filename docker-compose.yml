version: '3.8'

services:
  app-backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks:
      - app-network

  app-frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge