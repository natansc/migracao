version: '3.8'

services:
  app-backend:
    build:
      context: ./backend
    ports:
      - "3001:3001" # Removido o 127.0.0.1 para o Nginx conseguir acessar
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      # APONTE PARA O IP DA SUA VM (onde o Postgres nativo está rodando)
      # Troque 'sua_senha_aqui' pela senha do usuário postgres
      - DATABASE_URL="postgresql://migracao:Sup%402022@172.16.20.9:5432/migracao?schema=public"
    networks:
      - app-network

  app-frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80" # Removido o 127.0.0.1
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge